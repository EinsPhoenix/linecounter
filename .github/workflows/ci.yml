name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package (check that the extension builds)
        run: npx vsce package --out /tmp/linecounter-ci.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: linecounter-vsix
          path: /tmp/linecounter-ci.vsix
